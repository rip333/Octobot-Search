name: CI

# Deployment is owned by the Vercel Git integration. This workflow only
# verifies the branch; it never publishes anything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: nothing here writes to the repository or publishes artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to immutable commit SHAs; the trailing comment
      # records which release each SHA corresponds to.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Builds the homepage against live Cerebro. A total upstream outage fails
      # the build on purpose: an empty homepage must never be cached as content.
      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=info
